name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Install as a package and smoke-test the console script
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install .
          .venv-smoke/bin/qrdrop --version
          .venv-smoke/bin/qrdrop qr "https://example.com" --plain
